name: Patch Agent Knowledge 4.3

on:
  push:
    branches:
      - agent-doc-4-3-short-term-memory

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-doc-4-3-short-term-memory
          fetch-depth: 0

      - name: Patch 4.3 section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          doc = Path('Agent_Knowledge_System.md')
          section_file = Path('staging/agent_4_3_short_term_memory.md')
          text = doc.read_text(encoding='utf-8')
          new_section = section_file.read_text(encoding='utf-8').rstrip('\n')

          section_pattern = re.compile(
              r'### 4\.3 Short-term Memory(?:\n.*?)?(?=\n### 4\.4 Long-term Memory)',
              re.DOTALL,
          )
          matches = section_pattern.findall(text)
          assert len(matches) == 1, f'expected one 4.3 section, got {len(matches)}'
          text = section_pattern.sub(lambda _m: new_section, text, count=1)

          progress_pattern = re.compile(
              r'^\|\s*II\s*\|\s*4\. Context, Memory & Retrieval\s*\|.*\|$',
              re.MULTILINE,
          )
          progress_matches = progress_pattern.findall(text)
          assert len(progress_matches) == 1, f'expected one chapter-4 progress row, got {progress_matches}'
          text = progress_pattern.sub(
              '| II | 4. Context, Memory & Retrieval | 进行中：4.1–4.3 已完成 |',
              text,
              count=1,
          )

          footer_pattern = re.compile(
              r'^下一步：继续 .*4\. Context, Memory & Retrieval.*4\.3 Short-term Memory.*$',
              re.MULTILINE,
          )
          footer_matches = footer_pattern.findall(text)
          assert len(footer_matches) == 1, f'expected one 4.3 footer, got {footer_matches}'
          text = footer_pattern.sub(
              '下一步：继续 **II. Capabilities & Interoperability → 4. Context, Memory & Retrieval → 4.4 Long-term Memory**。',
              text,
              count=1,
          )

          doc.write_text(text, encoding='utf-8')
          print('PATCH_OK')
          PY

      - name: Verify patched sections
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('Agent_Knowledge_System.md').read_text(encoding='utf-8')
          assert '#### 4.3.1 什么是 Short-term Memory？' in text
          assert '#### 4.3.101 参考资料' in text
          assert '| II | 4. Context, Memory & Retrieval | 进行中：4.1–4.3 已完成 |' in text
          assert '→ 4.4 Long-term Memory**。' in text
          print('VERIFY_OK')
          PY

      - name: Remove temporary patch files
        run: |
          rm -f staging/agent_4_3_short_term_memory.md
          rm -f .github/workflows/agent-doc-4-3-patch.yml
          rmdir staging 2>/dev/null || true

      - name: Commit document and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: write 4.3 short-term memory"
          git push origin HEAD:agent-doc-4-3-short-term-memory
