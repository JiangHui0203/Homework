name: Patch Agent Knowledge 4.4

on:
  push:
    branches:
      - agent-doc-4-4-long-term-memory

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-doc-4-4-long-term-memory
          fetch-depth: 0

      - name: Patch document
        run: python scripts/tmp_patch_agent_4_4.py

      - name: Verify patched section
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('Agent_Knowledge_System.md').read_text(encoding='utf-8')
          assert '#### 4.4.137 参考资料' in text
          assert '| II | 4. Context, Memory & Retrieval | 进行中：4.1–4.4 已完成 |' in text
          assert '→ 4.5 Persistence**。' in text
          print('VERIFY_OK')
          PY

      - name: Remove temporary patch machinery
        run: |
          rm -f tmp_agent_4_4_section.md
          rm -f scripts/tmp_patch_agent_4_4.py
          rm -f .github/workflows/agent-doc-4-4-patch.yml

      - name: Commit patched document and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: write 4.4 long-term memory"
          git push origin HEAD:agent-doc-4-4-long-term-memory
