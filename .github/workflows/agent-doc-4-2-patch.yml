name: Patch Agent Knowledge 4.2

on:
  push:
    branches:
      - agent-doc-4-2-working-state

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-doc-4-2-working-state
          fetch-depth: 0

      - name: Fetch completed 4.1 staging branch
        run: |
          git fetch origin agent-doc-4-1-context-engineering:refs/remotes/origin/agent-doc-4-1-context-engineering

      - name: Patch document
        run: python scripts/tmp_patch_agent_4_2.py

      - name: Verify patched sections
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('Agent_Knowledge_System.md').read_text(encoding='utf-8')
          assert '#### 4.1.67 参考资料' in text
          assert '#### 4.2.106 参考资料' in text
          assert '| II | 4. Context, Memory & Retrieval | 进行中：4.1–4.2 已完成 |' in text
          assert '→ 4.3 Short-term Memory**。' in text
          print('VERIFY_OK')
          PY

      - name: Remove temporary patch machinery
        run: |
          rm -f scripts/tmp_patch_agent_4_2.py
          rm -f .github/workflows/agent-doc-4-2-patch.yml

      - name: Commit patched document and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: write 4.2 working state"
          git push origin HEAD:agent-doc-4-2-working-state
