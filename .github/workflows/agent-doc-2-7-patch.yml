name: Patch Agent Knowledge 2.7

on:
  push:
    branches:
      - agent-doc-2-7-routing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch document
        run: python .tmp/patch_agent_2_7.py
      - name: Commit update
        run: |
          git config user.name "A_Jiang"
          git config user.email "79295145+JiangHui0203@users.noreply.github.com"
          git add Agent_Knowledge_System.md
          git diff --cached --quiet || git commit -m "docs: add Routing foundations"
          git push
