name: Patch Agent Knowledge 4.1

on:
  push:
    branches:
      - agent-doc-4-1-context-engineering

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-doc-4-1-context-engineering
          fetch-depth: 0

      - name: Harden patch matcher
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("scripts/tmp_patch_agent_4_1.py")
          src = p.read_text(encoding="utf-8")
          marker = "assert text.count(old_section) == 1"
          assert marker in src, "patch-tail marker not found"
          head = src.split(marker, 1)[0]
          tail = r'''section_pattern = re.compile(
              r'### 4\.1 Context Engineering\n.*?(?=\n### 4\.2 Working State)',
              re.DOTALL,
          )
          section_matches = section_pattern.findall(text)
          assert len(section_matches) == 1, f"expected one 4.1 section, got {len(section_matches)}"
          text = section_pattern.sub(new_section.rstrip("\n"), text, count=1)

          progress_pattern = re.compile(
              r'^\|\s*II\s*\|\s*4\. Context, Memory & Retrieval\s*\|.*\|$',
              re.MULTILINE,
          )
          progress_matches = progress_pattern.findall(text)
          assert len(progress_matches) == 1, f"expected one chapter-4 progress row, got {progress_matches}"
          text = progress_pattern.sub(
              '| II | 4. Context, Memory & Retrieval | 进行中：4.1 已完成 |',
              text,
              count=1,
          )

          footer_pattern = re.compile(
              r'^下一步：继续 .*4\. Context, Memory & Retrieval.*4\.1 Context Engineering.*$',
              re.MULTILINE,
          )
          footer_matches = footer_pattern.findall(text)
          assert len(footer_matches) == 1, f"expected one 4.1 footer, got {footer_matches}"
          text = footer_pattern.sub(
              '下一步：继续 **II. Capabilities & Interoperability → 4. Context, Memory & Retrieval → 4.2 Working State**。',
              text,
              count=1,
          )

          path.write_text(text, encoding="utf-8")
          print("PATCH_OK")
          '''
          p.write_text(head + tail, encoding="utf-8")
          PY

      - name: Patch document
        run: python scripts/tmp_patch_agent_4_1.py

      - name: Commit patched document
        run: |
          if git diff --quiet -- Agent_Knowledge_System.md; then
            echo "No document changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Agent_Knowledge_System.md
          git commit -m "docs: write 4.1 context engineering"
          git push origin HEAD:agent-doc-4-1-context-engineering
