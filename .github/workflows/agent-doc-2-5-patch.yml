    branches: [agent-doc-2-5-reflection]
    paths: [.github/workflows/agent-doc-2-5-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch document
        run: |
          python .tmp/patch_agent_2_5.py
          git config user.name "A_Jiang"
          git config user.email "79295145+JiangHui0203@users.noreply.github.com"
          git add Agent_Knowledge_System.md
          git commit -m "docs: add Reflection and Critique foundations"
          git push
