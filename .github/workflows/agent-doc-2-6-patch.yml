name: Patch Agent Knowledge 2.6

on:
  push:
    branches:
      - agent-doc-2-6-verification
    paths:
      - '.tmp/patch_agent_2_6.py'
      - '.tmp/agent-2-6-verification-section.md'
      - '.github/workflows/agent-doc-2-6-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-doc-2-6-verification
      - name: Apply section patch
        run: python .tmp/patch_agent_2_6.py
      - name: Commit document update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Agent_Knowledge_System.md
          if git diff --cached --quiet; then
            echo "No document changes"
            exit 0
          fi
          git commit -m "docs: add Verification foundations"
          git push origin HEAD:agent-doc-2-6-verification
