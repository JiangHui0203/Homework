name: Patch Agent Knowledge 2.1

on:
  push:
    branches: [agent-doc-2-1-what-is-agent]
    paths: [.github/workflows/agent-doc-2-1-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch document
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib

          payload = ""
          section = zlib.decompress(base64.b64decode(payload)).decode('utf-8')

          p = Path('Agent_Knowledge_System.md')
          s = p.read_text(encoding='utf-8')

          old = "### 2.1 What is an Agent?\n\n待补充。"
          assert old in s, '2.1 placeholder not found'
          s = s.replace(old, section, 1)

          old_status = "| I | 2. Agent Decision Loop | 待写 |"
          assert old_status in s, 'progress row not found'
          s = s.replace(old_status, "| I | 2. Agent Decision Loop | 进行中：2.1 已完成 |", 1)

          old_next = "下一步：进入 **I. Model & Decision Core → 2. Agent Decision Loop → 2.1 What is an Agent?**。"
          assert old_next in s, 'next-step marker not found'
          s = s.replace(old_next, "下一步：继续 **I. Model & Decision Core → 2. Agent Decision Loop → 2.2 Agent Loop**。", 1)

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "A_Jiang"
          git config user.email "79295145+JiangHui0203@users.noreply.github.com"
          git add Agent_Knowledge_System.md
          git commit -m "docs: add what is an agent foundations"
          git push origin HEAD:agent-doc-2-1-what-is-agent