name: Patch Agent Knowledge 5.4

on:
  push:
    branches:
      - agent-doc-5-4-capability-discovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-doc-5-4-capability-discovery
      - name: Patch document
        run: python .tmp/patch_agent_5_4.py
      - name: Verify patch
        run: |
          grep -Fq '#### 5.4.1 定义：Capability Discovery 到底是什么？' Agent_Knowledge_System.md
          grep -Fq '#### 5.4.257 参考资料' Agent_Knowledge_System.md
          grep -Fq '| II | 5. Capability Extension & Protocols | 已完成：5.1–5.4 |' Agent_Knowledge_System.md
          grep -Fq '下一步：继续 **II. Capabilities & Interoperability → 6.' Agent_Knowledge_System.md
      - name: Remove temporary patch files
        run: |
          rm -f .tmp/agent-5-4-capability-discovery-section.md
          rm -f .tmp/patch_agent_5_4.py
          rm -f .github/workflows/agent-doc-5-4-patch.yml
      - name: Commit result
        run: |
          git config user.name 'A_Jiang'
          git config user.email '79295145+JiangHui0203@users.noreply.github.com'
          git add -A
          git commit -m 'docs: complete 5.4 Capability Discovery'
          git push origin HEAD:agent-doc-5-4-capability-discovery
