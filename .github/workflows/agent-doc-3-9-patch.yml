name: Patch Agent Knowledge 3.9

on:
  push:
    branches:
      - agent-doc-3-9-side-effects
    paths:
      - '.tmp/agent-3-9-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-doc-3-9-side-effects
      - name: Apply patch
        run: python .tmp/patch_agent_3_9.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Agent_Knowledge_System.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: add Side Effects foundations"
          git push
