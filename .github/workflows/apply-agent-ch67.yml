name: apply-agent-ch67

on:
  push:
    branches:
      - agent/ch6-7-a2a-20261020

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch6-7-a2a-20261020
          fetch-depth: 0

      - name: Apply guarded patch
        run: python .tmp_agent_ch67/apply.py

      - name: Commit canonical document only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Agent_Knowledge_System.md
          git rm -r .tmp_agent_ch67
          git rm .github/workflows/apply-agent-ch67.yml
          git commit -m "docs: complete Agent 6.7 A2A"
          git push origin HEAD:agent/ch6-7-a2a-20261020
