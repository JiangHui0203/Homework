name: Patch Agent Knowledge 1.8

on:
  push:
    branches: [agent-doc-1-8-budget]
    paths: [.github/workflows/agent-doc-1-8-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch document
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          payload = ""
          script = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          exec(compile(script, '<patch>', 'exec'))
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Agent_Knowledge_System.md
          git commit -m 'docs: add token cost latency budget foundations for agents'
          git push
