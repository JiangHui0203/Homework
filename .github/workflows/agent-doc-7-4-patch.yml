name: Patch Agent Knowledge 7.4

on:
  push:
    branches:
      - agent-doc-7-4-context-policy
    paths:
      - '.tmp/agent-7-4-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-doc-7-4-context-policy
      - name: Patch document
        run: python .tmp/patch_agent_7_4.py
      - name: Verify patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('Agent_Knowledge_System.md').read_text(encoding='utf-8')
          assert '#### 7.4.1 为什么 Harness 需要独立的 Context Policy' in s
          assert '#### 7.4.162 参考资料' in s
          assert re.search(r'^\| [^|]+ \| 7\.[^|]+ \| 进行中：7\.1–7\.4 已完成；下一节 7\.5[^|]+ \|$', s, re.M)
          print('VERIFY_OK')
          PY
      - name: Remove temporary patch files
        run: |
          rm -f .tmp/agent-7-4-context-policy-section.md
          rm -f .tmp/patch_agent_7_4.py
          rm -f .tmp/agent-7-4-trigger.txt
          rm -f .github/workflows/agent-doc-7-4-patch.yml
      - name: Commit result
        run: |
          git config user.name 'A_Jiang'
          git config user.email '79295145+JiangHui0203@users.noreply.github.com'
          git add Agent_Knowledge_System.md .tmp .github/workflows/agent-doc-7-4-patch.yml || true
          git commit -m 'docs: complete Agent 7.4 Context Policy'
          git push origin HEAD:agent-doc-7-4-context-policy
