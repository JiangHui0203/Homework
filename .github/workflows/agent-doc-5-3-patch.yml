name: Patch Agent Knowledge 5.3

on:
  push:
    branches:
      - agent-doc-5-3-mcp
    paths:
      - scripts/patch_agent_5_3_mcp.py
      - .tmp/agent_5_3_mcp.md
      - .github/workflows/agent-doc-5-3-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-doc-5-3-mcp
          fetch-depth: 0
      - name: Patch document
        run: python scripts/patch_agent_5_3_mcp.py
      - name: Verify patch
        run: |
          grep -Fq '#### 5.3.215 参考资料' Agent_Knowledge_System.md
          grep -Fq '| II | 5. Capability Extension & Protocols | 进行中：5.1–5.3 已完成 |' Agent_Knowledge_System.md
          grep -Fq '下一步：继续 **II. Capabilities & Interoperability → 5. Capability Extension → 5.4 Capability Discovery**。' Agent_Knowledge_System.md
      - name: Remove temporary patch files
        run: |
          rm -f .tmp/agent_5_3_mcp.md
          rm -f scripts/patch_agent_5_3_mcp.py
          rm -f .github/workflows/agent-doc-5-3-patch.yml
      - name: Commit result
        run: |
          git config user.name 'A_Jiang'
          git config user.email '79295145+JiangHui0203@users.noreply.github.com'
          git add -A
          git commit -m 'docs: complete 5.3 MCP'
          git push origin HEAD:agent-doc-5-3-mcp
