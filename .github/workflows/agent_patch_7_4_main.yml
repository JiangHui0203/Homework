name: Apply Agent 7.4 Context Policy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/agent_patch_7_4_main.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble staged section
        run: |
          git fetch origin agent-patch-7-4:refs/remotes/origin/agent-patch-7-4
          : > /tmp/agent_7_4_section.md
          for part in 01 02 03 04 05; do
            git show "origin/agent-patch-7-4:.agent_patch/7_4/part${part}.md" >> /tmp/agent_7_4_section.md
          done
          grep -q '^#### 7.4.1 ' /tmp/agent_7_4_section.md
          grep -q '^#### 7.4.76 参考资料$' /tmp/agent_7_4_section.md

      - name: Patch canonical document
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Agent_Knowledge_System.md')
          text = path.read_text(encoding='utf-8')
          section = Path('/tmp/agent_7_4_section.md').read_text(encoding='utf-8').strip()

          sentinel = '### 7.4 Context Policy\n### 7.5 Tool Policy'
          assert text.count(sentinel) == 1, f'unexpected 7.4 sentinel count: {text.count(sentinel)}'
          text = text.replace(
              sentinel,
              '### 7.4 Context Policy\n\n' + section + '\n\n### 7.5 Tool Policy',
              1,
          )

          old_progress = '| III | 7. Agent Harness | 进行中：7.1–7.3 已完成；下一节 7.4 Context Policy |'
          new_progress = '| III | 7. Agent Harness | 进行中：7.1–7.4 已完成；下一节 7.5 Tool Policy |'
          assert text.count(old_progress) == 1, f'unexpected progress marker count: {text.count(old_progress)}'
          text = text.replace(old_progress, new_progress, 1)

          stale = '7.3–7.11 待补充。'
          assert text.count(stale) == 1, f'unexpected stale range count: {text.count(stale)}'
          text = text.replace(stale, '7.5–7.11 待补充。', 1)

          assert text.count('### 7.4 Context Policy') == 1
          assert text.count('#### 7.4.76 参考资料') == 1
          assert text.count('### 7.5 Tool Policy') == 1
          assert '下一节 7.5 Tool Policy' in text

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          grep -q '^#### 7.4.76 参考资料$' Agent_Knowledge_System.md
          grep -q '7.1–7.4 已完成；下一节 7.5 Tool Policy' Agent_Knowledge_System.md
          grep -q '^7.5–7.11 待补充。$' Agent_Knowledge_System.md
          rm .github/workflows/agent_patch_7_4_main.yml
          changed="$(git diff --name-only | sort)"
          expected=$(printf '%s\n%s' '.github/workflows/agent_patch_7_4_main.yml' 'Agent_Knowledge_System.md' | sort)
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: complete Agent 7.4 Context Policy'
          git push origin HEAD:main
