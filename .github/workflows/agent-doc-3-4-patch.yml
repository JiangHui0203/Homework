name: Patch Agent Knowledge 3.4

on:
  push:
    branches:
      - agent-doc-3-4-tool-selection
    paths:
      - '.tmp/agent-3-4-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-doc-3-4-tool-selection
          fetch-depth: 0
      - name: Patch Agent_Knowledge_System.md
        run: python .tmp/patch_agent_3_4.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Agent_Knowledge_System.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: add Tool Selection foundations'
          git push origin HEAD:agent-doc-3-4-tool-selection
