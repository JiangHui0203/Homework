name: Apply 6.3 Subagents patch

on:
  push:
    branches:
      - docs/6-3-subagents
    paths:
      - .github/workflows/apply-6-3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: docs/6-3-subagents

      - name: Apply exact document patch
        run: python .tmp_apply_6_3.py

      - name: Remove temporary patch machinery
        run: rm -f .tmp_apply_6_3.py .github/workflows/apply-6-3.yml

      - name: Validate result
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q '^#### 6\.3\.111 参考资料$' Agent_Knowledge_System.md
          grep -q '进行中：6.1–6.3 已完成' Agent_Knowledge_System.md
          grep -q '→ 6.4 Communication\*\*。' Agent_Knowledge_System.md
          test ! -e .tmp_apply_6_3.py

      - name: Commit final patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: complete 6.3 Subagents'
          git push origin HEAD:docs/6-3-subagents
