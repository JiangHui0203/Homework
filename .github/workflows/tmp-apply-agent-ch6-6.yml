name: tmp-apply-agent-ch6-6

on:
  push:
    branches:
      - agent/ch6-6-coordination-failure-20261020

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch6-6-coordination-failure-20261020
          fetch-depth: 0

      - name: Apply guarded patch
        run: python .tmp_patch_agent_ch6_6.py

      - name: Remove temporary staging files
        run: |
          rm -f .tmp_agent_ch6_6_part1.md
          rm -f .tmp_agent_ch6_6_part2.md
          rm -f .tmp_agent_ch6_6_part3.md
          rm -f .tmp_patch_agent_ch6_6.py
          rm -f .github/workflows/tmp-apply-agent-ch6-6.yml

      - name: Verify final working tree scope
        run: |
          test -f Agent_Knowledge_System.md
          git diff -- Agent_Knowledge_System.md | grep -q "6.6 Coordination Failure"
          git status --short

      - name: Commit canonical change
        run: |
          git config user.name "A_Jiang"
          git config user.email "79295145+JiangHui0203@users.noreply.github.com"
          git add -A
          git commit -m "docs: complete Agent 6.6 Coordination Failure"
          git push origin HEAD:agent/ch6-6-coordination-failure-20261020
