name: Patch Agent Knowledge 2.3

on:
  push:
    branches:
      - agent-doc-2-3-react
    paths:
      - .github/workflows/agent-doc-2-3-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch document
        run: python .tmp/patch_agent_2_3.py

      - name: Commit document
        run: |
          git config user.name "A_Jiang"
          git config user.email "79295145+JiangHui0203@users.noreply.github.com"
          git add Agent_Knowledge_System.md
          git commit -m "docs: add ReAct decision pattern"
          git push
