name: Patch Agent Knowledge 1.7

on:
  push:
    branches: [agent-doc-1-7-multimodal]
    paths: [.github/workflows/agent-doc-1-7-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch document
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib

          payload = ""
          new = zlib.decompress(base64.b64decode(payload)).decode('utf-8')

          p = Path('Agent_Knowledge_System.md')
          s = p.read_text(encoding='utf-8')
          old = "### 1.7 Multimodal Input\n\n待补充。"
          assert old in s, '1.7 placeholder not found'
          s = s.replace(old, new, 1)
          s = s.replace('进行中：1.1–1.6 已完成', '进行中：1.1–1.7 已完成', 1)
          s = s.replace('下一步：继续 **I. Model & Decision Core → 1.7 Multimodal Input**。', '下一步：继续 **I. Model & Decision Core → 1.8 Token / Cost / Latency Budget**。', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit document update
        shell: bash
        run: |
          git config user.name "agent-doc-bot"
          git config user.email "agent-doc-bot@users.noreply.github.com"
          git add Agent_Knowledge_System.md
          git commit -m "docs: add multimodal input foundations for agents"
          git push origin HEAD:agent-doc-1-7-multimodal
