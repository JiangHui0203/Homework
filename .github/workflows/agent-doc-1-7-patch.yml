#### 1.7.23 本节一句话总结

> **Multimodal Input 对 Agent 的真正意义，是把图像、屏幕、音频等纳入 Environment Observation；可靠的多模态 Agent 必须把“感知到了什么、目标在哪里、是否应该行动、行动后环境是否如预期变化”拆成可验证的闭环，而不能把“模型看懂了图片”直接等同于“Agent 能可靠操作真实环境”。**'''

