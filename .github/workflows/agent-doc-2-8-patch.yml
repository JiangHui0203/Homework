name: Patch Agent Knowledge 2.8

on:
  push:
    branches:
      - agent-doc-2-8-agent-vs-workflow
    paths:
      - '.github/workflows/agent-doc-2-8-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-doc-2-8-agent-vs-workflow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch document
        run: python .tmp/patch_agent_2_8.py
      - name: Commit update
        run: |
          git config user.name "A_Jiang"
          git config user.email "79295145+JiangHui0203@users.noreply.github.com"
          git add Agent_Knowledge_System.md
          if git diff --cached --quiet; then
            echo "No document changes"
            exit 0
          fi
          git commit -m "docs: complete Agent vs Workflow foundations"
          git push origin HEAD:agent-doc-2-8-agent-vs-workflow
