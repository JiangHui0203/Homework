  <rect class="node" x="1110" y="405" width="220" height="80"/>
  <text class="nodeText" x="1220" y="450">Failure Symptom</text>

  <rect class="node" x="850" y="405" width="220" height="80"/>
  <text class="nodeText" x="960" y="439">Immediate Mechanism</text>
  <text class="nodeSub" x="960" y="464">How the failure happened</text>

  <rect class="node" x="590" y="405" width="220" height="80"/>
  <text class="nodeText" x="700" y="450">Root Cause</text>

  <rect class="node" x="330" y="405" width="220" height="80"/>
  <text class="nodeText" x="440" y="439">Failure Owner</text>
  <text class="nodeSub" x="440" y="464">Who should fix first?</text>

  <rect class="node" x="70" y="405" width="220" height="80"/>
  <text class="nodeText" x="180" y="439">Intervention Routing</text>
  <text class="nodeSub" x="180" y="464">Data · Model · Tool · Harness · Eval</text>

