  <rect width="1600" height="950" fill="#fff"/>
  <text x="70" y="65" class="title">F6 — Credit → Failure Causal Map</text>
  <text x="70" y="98" class="subtitle">从 Outcome 到 Root Cause / Owner 不能跳步；Credit Assignment 与 Failure Diagnosis 相连，但不是同一个问题。</text>

  <!-- Main causal spine row 1 -->
  <rect class="node" x="70" y="180" width="220" height="80"/>
  <text class="nodeText" x="180" y="214">Observed Outcome</text>
  <text class="nodeSub" x="180" y="239">Success / Failure / Partial</text>

  <rect class="node" x="330" y="180" width="220" height="80"/>
  <text class="nodeText" x="440" y="225">First Error</text>

  <rect class="node" x="590" y="180" width="220" height="80"/>
  <text class="nodeText" x="700" y="214">First Harmful Action</text>
  <text class="nodeSub" x="700" y="239">First action that lowers reachable value</text>

  <rect class="node" x="850" y="180" width="220" height="80"/>
  <text class="nodeText" x="960" y="214">Last Recoverable State</text>
  <text class="nodeSub" x="960" y="239">Better future still reachable</text>

  <rect class="node" x="1110" y="180" width="220" height="80"/>
  <text class="nodeText" x="1220" y="214">Point of No Return</text>
  <text class="nodeSub" x="1220" y="239">Unacceptable state becomes committed</text>

  <path class="edge" d="M290 220 L330 220"/>
  <path class="edge" d="M550 220 L590 220"/>
  <path class="edge" d="M810 220 L850 220"/>
  <path class="edge" d="M1070 220 L1110 220"/>

