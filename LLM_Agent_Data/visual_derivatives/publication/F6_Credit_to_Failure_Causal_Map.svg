  <path class="edge" d="M850 445 L810 445"/>
  <path class="edge" d="M590 445 L550 445"/>
  <path class="edge" d="M330 445 L290 445"/>

  <!-- Auxiliary branch: recoverability -->
  <rect class="branchBox" x="850" y="285" width="220" height="90"/>
  <text class="branchTitle" x="875" y="313">Recovery lens</text>
  <text class="branchText" x="875" y="340">Recoverability</text>
  <text class="branchText" x="875" y="361">→ Repairability</text>
  <path class="aux" d="M960 260 L960 285"/>

  <!-- Auxiliary branch: counterfactual credit -->
  <rect class="branchBox" x="590" y="285" width="220" height="90"/>
  <text class="branchTitle" x="615" y="313">Credit lens</text>
  <text class="branchText" x="615" y="340">Counterfactual Credit</text>
  <text class="branchText" x="615" y="361">→ Learning Signal</text>
  <path class="aux" d="M700 260 L700 285"/>

  <!-- Critical boundaries -->
  <rect class="boundary" x="70" y="555" width="1460" height="100"/>
  <text class="boundaryTitle" x="95" y="585">Critical boundaries</text>
  <text class="boundaryText" x="95" y="620">First Error ≠ First Harmful Action ≠ Root Cause</text>
  <text class="boundaryText" x="610" y="620">Failure Layer ≠ Failure Owner</text>
  <text class="boundaryText" x="975" y="620">Recoverability ≠ Repairability</text>

  <!-- Case callouts -->
  <rect class="caseBox" x="70" y="690" width="700" height="135"/>
  <text class="caseTitle" x="95" y="720">C1-F1 — Model / Policy-owned failure</text>
  <text class="caseText" x="95" y="751">shipped observed → stop condition missed → refund_order(1847) → forbidden side effect</text>
  <text class="caseText" x="95" y="779">Root Cause candidate: observation grounding / conditional policy; Owner: Model / Policy</text>

  <rect class="caseBox" x="830" y="690" width="700" height="135"/>
  <text class="caseTitle" x="855" y="720">C3-F5 — Harness-owned failure</text>
  <text class="caseText" x="855" y="751">tool backend failed → harness exposed success → agent received false observation → reported success</text>
  <text class="caseText" x="855" y="779">Symptom appears in Agent output, but Root Cause / Owner is Harness</text>

